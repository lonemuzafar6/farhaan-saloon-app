<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#111217"/>
  <circle cx="256" cy="256" r="210" stroke="#d97706" stroke-width="8" stroke-dasharray="16 8"/>
  <!-- Barber Scissors & Comb Crest -->
  <g transform="translate(136, 120)">
    <!-- Scissor Blade 1 -->
    <path d="M40 240 C 60 180, 100 120, 180 40 L 200 60 C 140 130, 90 190, 70 245 Z" fill="#fbbf24"/>
    <circle cx="50" cy="240" r="28" stroke="#fbbf24" stroke-width="12" fill="none"/>
    <!-- Scissor Blade 2 -->
    <path d="M200 240 C 180 180, 140 120, 60 40 L 40 60 C 100 130, 150 190, 170 245 Z" fill="#f59e0b"/>
    <circle cx="190" cy="240" r="28" stroke="#f59e0b" stroke-width="12" fill="none"/>
    <!-- Pivot screw -->
    <circle cx="120" cy="140" r="10" fill="#111217" stroke="#fbbf24" stroke-width="4"/>
  </g>
  <!-- Barber Pole Stripes Ribbon -->
  <rect x="226" y="340" width="60" height="70" rx="10" fill="#1f2937" stroke="#fbbf24" stroke-width="4"/>
  <path d="M228 355 L 284 345 M228 375 L 284 365 M228 395 L 284 385" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <!-- Monogram text -->
  <text x="256" y="460" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="4">FARHAAN</text>
</svg>
